<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northstar Homes — Sales Assistant</title>
  <style>
    :root {
      --bg: #0f1219;
      --panel: #161b26;
      --panel-2: #1d2432;
      --line: #262e3d;
      --text: #e8ecf4;
      --muted: #9aa5b8;
      --accent: #f0b429;
      --agent: #1d2432;
      --user: #2a5bd7;
      --ok: #37b87c;
      --bad: #e0574f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: min(760px, 100%);
      display: flex;
      flex-direction: column;
      padding: 20px 18px 28px;
      gap: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .star { color: var(--accent); font-size: 26px; }
    h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
    .sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

    .pill {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 11.5px;
      white-space: nowrap;
    }

    .chat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      height: 52vh;
      min-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg { max-width: 78%; }
    .msg p {
      margin: 0;
      padding: 10px 13px;
      border-radius: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.agent { align-self: flex-start; }
    .msg.agent p { background: var(--agent); border-top-left-radius: 4px; }
    .msg.user { align-self: flex-end; }
    .msg.user p { background: var(--user); border-top-right-radius: 4px; }
    .msg.typing p { color: var(--muted); font-style: italic; }

    .banner {
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13px;
      border: 1px solid var(--line);
    }
    .banner.ok { border-color: var(--ok); color: var(--ok); }
    .banner.bad { border-color: var(--bad); color: var(--bad); }

    .composer { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    button {
      background: var(--accent);
      color: #1a1408;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.07); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .actions { display: flex; gap: 8px; }
    .toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }

    .analytics {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .analytics h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: 12.5px/1.5 "Cascadia Mono", Consolas, monospace;
      color: #cdd6e6;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <span class="star">✦</span>
        <div>
          <h1>Northstar Homes</h1>
          <p class="sub">Northstar One · Sector 79, Gurugram</p>
        </div>
      </div>
      <div class="status">
        <span id="backend" class="pill">connecting…</span>
      </div>
    </header>

    <section id="chat" class="chat" aria-live="polite">
      <div class="msg agent">
        <p>Hi, this is Ava from Northstar Homes, about Northstar One in Sector 79, Gurugram. Are you looking at a two BHK or a three BHK?</p>
      </div>
    </section>

    <div id="banner" class="banner hidden"></div>

    <form id="composer" class="composer" autocomplete="off">
      <input
        id="input"
        type="text"
        placeholder="Type in English, Hindi or Hinglish…"
        aria-label="Your message"
        maxlength="2000"
      />
      <button id="send" type="submit">Send</button>
    </form>

    <div class="toolbar">
      <label class="toggle">
        <input type="checkbox" id="failToggle" />
        <span>Simulate booking failure</span>
      </label>
      <div class="actions">
        <button id="resetBtn" type="button" class="ghost">New chat</button>
        <button id="endBtn" type="button">End chat &amp; see analytics</button>
      </div>
    </div>

    <section id="analytics" class="analytics hidden">
      <h2>Post-conversation analytics</h2>
      <pre id="analyticsJson"></pre>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const chat = document.getElementById("chat");
      const form = document.getElementById("composer");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const endBtn = document.getElementById("endBtn");
      const resetBtn = document.getElementById("resetBtn");
      const failToggle = document.getElementById("failToggle");
      const banner = document.getElementById("banner");
      const analyticsBox = document.getElementById("analytics");
      const analyticsJson = document.getElementById("analyticsJson");
      const backendPill = document.getElementById("backend");

      const OPENING_LINE =
        "Hi, this is Ava from Northstar Homes, about Northstar One in Sector 79, Gurugram. Are you looking at a two BHK or a three BHK?";

      let sessionId = null;

      function bubble(text, who, extraClass) {
        const wrap = document.createElement("div");
        wrap.className = `msg ${who}${extraClass ? " " + extraClass : ""}`;
        const p = document.createElement("p");
        p.textContent = text;
        wrap.appendChild(p);
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
        return wrap;
      }

      function showBanner(text, kind) {
        banner.textContent = text;
        banner.className = `banner ${kind}`;
      }

      function clearBanner() {
        banner.className = "banner hidden";
        banner.textContent = "";
      }

      async function postJson(url, body) {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        return res.json();
      }

      async function send(message) {
        bubble(message, "user");
        const typing = bubble("Ava is typing…", "agent", "typing");
        sendBtn.disabled = true;

        try {
          const data = await postJson("/chat", {
            message,
            session_id: sessionId,
            force_booking_failure: failToggle.checked,
          });
          sessionId = data.session_id;
          typing.remove();
          bubble(data.reply, "agent");

          if (data.booking) {
            if (data.booking.ok) {
              showBanner(
                `Site visit booked — ${data.booking.when} · ref ${data.booking.confirmation_id}`,
                "ok"
              );
            } else {
              showBanner(`Booking failed — ${data.booking.reason}`, "bad");
            }
          }
        } catch (err) {
          typing.remove();
          bubble(`Could not reach the server (${err.message}).`, "agent");
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = "";
        send(message);
      });

      endBtn.addEventListener("click", async () => {
        if (!sessionId) {
          showBanner("Say something first, then end the chat.", "bad");
          return;
        }
        endBtn.disabled = true;
        try {
          const data = await postJson("/end", { session_id: sessionId });
          analyticsJson.textContent = JSON.stringify(data.analytics, null, 2);
          analyticsBox.classList.remove("hidden");
          analyticsBox.scrollIntoView({ behavior: "smooth", block: "end" });
        } catch (err) {
          showBanner(`Could not load analytics (${err.message}).`, "bad");
        } finally {
          endBtn.disabled = false;
        }
      });

      resetBtn.addEventListener("click", async () => {
        if (sessionId) {
          try {
            await postJson("/reset", { session_id: sessionId });
          } catch (err) {
            /* a fresh session id is enough */
          }
        }
        sessionId = null;
        chat.innerHTML = "";
        bubble(OPENING_LINE, "agent");
        analyticsBox.classList.add("hidden");
        analyticsJson.textContent = "";
        clearBanner();
        input.focus();
      });

      fetch("/health")
        .then((res) => res.json())
        .then((data) => {
          backendPill.textContent =
            data.llm.mode === "mock" ? "offline mock mode" : `groq · ${data.llm.model}`;
        })
        .catch(() => {
          backendPill.textContent = "server unreachable";
        });

      input.focus();
    })();
  </script>
</body>
</html>
